title: Seth Seokhee Han
url: https://sethseokheehan.github.io
baseurl: ""

plugins:
  - jekyll/scholar
  - jekyll-sitemap

collections:
  news:
    output: false

scholar:
  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib
  bibliography_list_tag: ul
  bibliography_class: papers

exclude:
  - bin/
  - CLAUDE.md
  - docker-compose.yml
  - Images/
  - LICENSE
  - package.json
  - package-lock.json
  - purgecss.config.js
  - README.md
  - requirements.txt
  - skills-lock.json
keep_files:
  - CNAME
  - .nojekyll
