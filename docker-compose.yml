services:
  jekyll:
    image: ruby:3.3.5
    working_dir: /srv/jekyll
    command: sh -c "bundle install && bundle exec jekyll serve --host 0.0.0.0 --port 8080 --livereload"
    ports:
      - 8080:8080
      - 35729:35729
    volumes:
      - .:/srv/jekyll
      - bundle:/usr/local/bundle
    environment:
      - JEKYLL_ENV=development
volumes:
  bundle:
