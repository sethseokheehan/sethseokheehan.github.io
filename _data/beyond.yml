heading: Beyond research
paragraphs:
  - "I play rock drums, usually to Bring Me the Horizon, Linkin Park or Yorushika. I also work on short films, mostly editing or shooting, and one of them was selected for the <a href='https://www.biff.kr/eng/html/archive/arc_history_view.asp?kind=history&amp;pyear=2025&amp;m_idx=77158'>Busan International Film Festival</a>. Otherwise, I cook Korean food."
