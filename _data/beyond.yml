# Words and photos for the "Beyond research" section (_includes/beyond.liquid).
heading: Beyond research
paragraphs:
  - "I play rock drums, usually to Bring Me the Horizon, Linkin Park or Yorushika. I also work on short films, mostly editing or shooting, and one of them was selected for the <a href='https://www.biff.kr/eng/html/archive/arc_history_view.asp?kind=history&amp;pyear=2025&amp;m_idx=77158'>Busan International Film Festival</a>. When I'm not behind a drum kit or a camera, I cook Korean food for family and friends, or hunt for great restaurants around Boston and <a href='https://naver.me/FiPpCa9p'>across Korea</a>."
